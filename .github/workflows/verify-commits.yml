name: Verify Commit Signatures

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Check all commits are verified
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const unverified = commits.filter(c => !c.commit.verification.verified);

            if (unverified.length > 0) {
              const list = unverified.map(c => `- ${c.sha.slice(0,7)}: ${c.commit.message.split('\n')[0]}`).join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `此 PR 包含未签名或签名验证失败的提交，已自动关闭：\n${list}\n\n请使用 GPG 或 SSH 对提交签名后重新提交 PR。`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                state: 'closed'
              });
            }
